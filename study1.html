<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>study · listen & compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07060e;
        --panel: #100d1c;
        --line: rgba(162, 142, 228, 0.16);
        --line-2: rgba(176, 154, 240, 0.34);
        --text: #e7e3f2;
        --muted: #8a82a6;
        --faint: #544e6c;
        --lav: #b6a2f2;
        --blue: #8ab0ee;
        --ok: #86d2a8;
        --bad: #e89aa8;
        --grad: linear-gradient(90deg, #8ab0ee, #b6a2f2);
        --glow: 0 0 22px rgba(170, 150, 240, 0.28);
        --mono: "JetBrains Mono", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        background-image: radial-gradient(
          70% 55% at 50% 28%,
          rgba(138, 160, 238, 0.06),
          transparent 62%
        );
      }
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.7;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 860px;
        margin: 0 auto;
        padding: 0 22px 90px;
      }

      header {
        padding: 56px 0 8px;
      }
      .back {
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
      }
      .back:hover {
        color: var(--lav);
      }
      .topline {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 22px;
        gap: 16px;
      }
      h1 {
        font-weight: 500;
        font-size: clamp(24px, 4vw, 34px);
        text-transform: lowercase;
        letter-spacing: -0.01em;
      }
      .counter {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--lav);
        white-space: nowrap;
      }
      .pbar {
        height: 3px;
        border-radius: 3px;
        background: rgba(162, 142, 228, 0.14);
        margin-top: 16px;
        overflow: hidden;
      }
      .pbar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--grad);
        box-shadow: var(--glow);
        transition: width 0.35s;
      }

      .stage {
        margin-top: 26px;
        background: linear-gradient(
          180deg,
          rgba(16, 13, 28, 0.86),
          rgba(11, 9, 21, 0.86)
        );
        backdrop-filter: blur(3px);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px 24px;
      }
      .prompt-label {
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 8px;
      }
      .prompt-desc {
        font-size: 22px;
        color: var(--text);
        margin-bottom: 22px;
      }
      .prompt-desc b {
        color: var(--lav);
      }

      .vids {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 8px;
      }
      @media (max-width: 680px) {
        .vids {
          grid-template-columns: 1fr;
        }
      }
      .vid {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: #0b0915;
      }
      .vid .name {
        font-size: 12px;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin-bottom: 9px;
      }
      .vid video,
      .vid audio {
        width: 100%;
        border-radius: 8px;
        display: block;
        background: #000;
      }

      .q {
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .stmt {
        font-size: 14px;
        margin-bottom: 12px;
      }
      .choice {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .choice label {
        cursor: pointer;
      }
      .choice input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .choice span {
        display: inline-grid;
        place-items: center;
        min-width: 56px;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        transition: 0.16s;
        text-transform: lowercase;
      }
      .choice label:hover span {
        border-color: var(--line-2);
        color: var(--text);
      }
      .choice input:checked + span {
        border-color: var(--lav);
        background: var(--lav);
        color: #0b0915;
        box-shadow: var(--glow);
      }
      .choice input:focus-visible + span {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .q.missing .stmt {
        color: var(--bad);
      }

      /* ranking question (favourite) */
      .rankhint {
        font-size: 11px;
        color: var(--faint);
        margin: -4px 0 12px;
      }
      .rankrows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rankrow {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ranklabel {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--muted);
        min-width: 74px;
      }
      .rankopts {
        display: flex;
        gap: 7px;
      }
      .rankopts label {
        cursor: pointer;
      }
      .rankopts input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .rankopts span {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 50%;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12.5px;
        transition: 0.16s;
      }
      .rankopts label:hover span {
        border-color: var(--line-2);
        color: var(--text);
      }
      .rankopts input:checked + span {
        border-color: var(--lav);
        background: var(--lav);
        color: #0b0915;
        box-shadow: var(--glow);
      }
      .rankopts input:focus-visible + span {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      /* exit + demographics reuse field/scale/seg styles */
      .slab {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--lav);
        margin-bottom: 18px;
      }
      .field {
        margin: 18px 0;
      }
      .field > label {
        display: block;
        font-size: 13.5px;
        margin-bottom: 10px;
      }
      .req {
        color: var(--lav);
      }
      input[type="text"],
      input[type="number"],
      input[type="email"],
      select,
      textarea {
        width: 100%;
        background: #0b0915;
        color: var(--text);
        font-family: var(--mono);
        font-size: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 13px;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 18px,
          calc(100% - 13px) 18px;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--lav);
        box-shadow: var(--glow);
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .seg label {
        cursor: pointer;
      }
      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .seg span {
        display: inline-block;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        transition: 0.18s;
      }
      .seg label:hover span {
        border-color: var(--line-2);
        color: var(--text);
      }
      .seg input:checked + span {
        border-color: var(--lav);
        background: var(--lav);
        color: #0b0915;
        box-shadow: var(--glow);
      }
      .scale {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .anchor {
        font-size: 11px;
        color: var(--muted);
      }
      .anchor.r {
        text-align: right;
      }
      .dots {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .dots label {
        cursor: pointer;
      }
      .dots input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .dots span {
        display: grid;
        place-items: center;
        width: 33px;
        height: 33px;
        border-radius: 50%;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12.5px;
        transition: 0.16s;
      }
      .dots input:checked + span {
        border-color: var(--lav);
        background: var(--lav);
        color: #0b0915;
        box-shadow: var(--glow);
      }
      .field.missing > label {
        color: var(--bad);
      }

      /* consent + overview */
      .consent-head {
        font-size: 20px;
        color: var(--text);
        margin-bottom: 14px;
        text-transform: lowercase;
      }
      .consent p {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .consent p b {
        color: var(--text);
        font-weight: 500;
      }
      .consent ul {
        margin: 0 0 12px 18px;
      }
      .consent li {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .consent li b {
        color: var(--lav);
        font-weight: 500;
      }
      .consent a {
        color: var(--lav);
        text-decoration: none;
      }
      .agree {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--line-2);
        border-radius: 12px;
        cursor: pointer;
        transition: 0.16s;
      }
      .agree:hover {
        border-color: var(--lav);
      }
      .agree input {
        margin-top: 2px;
        width: 18px;
        height: 18px;
        accent-color: var(--lav);
        flex: 0 0 auto;
        cursor: pointer;
      }
      .agree span {
        font-size: 13.5px;
        color: var(--text);
      }
      .agree.missing {
        border-color: var(--bad);
      }
      .consent-note {
        font-size: 11px;
        color: var(--faint);
        margin-top: 12px;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .btn {
        font-family: var(--mono);
        font-size: 14px;
        padding: 13px 26px;
        border-radius: 999px;
        border: 1px solid var(--lav);
        background: var(--lav);
        color: #0b0915;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: var(--glow);
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        cursor: default;
      }
      .btn.loading {
        position: relative;
        color: transparent !important;
        pointer-events: none;
      }
      .btn.loading::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        border: 2px solid rgba(11, 9, 21, 0.3);
        border-top-color: #0b0915;
        animation: btnspin 0.7s linear infinite;
      }
      @keyframes btnspin {
        to {
          transform: rotate(360deg);
        }
      }
      .btn.ghost {
        background: transparent;
        color: var(--muted);
        border-color: var(--line);
      }
      .btn.ghost:hover {
        color: var(--text);
        border-color: var(--line-2);
        box-shadow: none;
      }
      .note {
        font-size: 12px;
        color: var(--faint);
      }
      .prize {
        max-width: 420px;
        margin: 24px auto 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        background: linear-gradient(
          180deg,
          rgba(16, 13, 28, 0.6),
          rgba(11, 9, 21, 0.6)
        );
        text-align: left;
      }
      .prize-line {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 14px;
        text-align: center;
      }
      .prize-line b {
        color: var(--lav);
      }
      .prize input {
        margin-bottom: 10px;
      }
      .prize .btn {
        width: 100%;
      }
      .prize-note {
        font-size: 12px;
        color: var(--bad);
        margin-top: 8px;
        text-align: center;
        min-height: 1em;
      }
      .prize-after {
        color: var(--lav);
        font-size: 14px;
        margin-top: 18px;
      }
      .done {
        text-align: center;
        padding: 80px 0;
      }
      .done h2 {
        font-weight: 500;
        font-size: 26px;
        text-transform: lowercase;
        margin-bottom: 12px;
      }
      .done p {
        color: var(--muted);
        font-size: 14px;
      }
      .done a {
        color: var(--lav);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="wrap">
      <header>
        <a class="back" href="index.html">← back</a>
        <div class="topline">
          <h1 id="title">listen &amp; compare</h1>
          <div class="counter" id="counter"></div>
        </div>
        <div class="pbar"><i id="pfill"></i></div>
      </header>

      <div class="stage" id="stage"></div>

      <div class="actions" id="actions">
        <button class="btn ghost" id="prev" style="display: none">
          ← back
        </button>
        <button class="btn" id="next">next →</button>
        <span class="note" id="note"></span>
      </div>

      <div class="done" id="done" style="display: none">
        <h2>thank you ✦</h2>
        <p>your responses were recorded.</p>
        <div class="prize" id="prize">
          <p class="prize-line">
            optional — enter the draw for
            <b>2 × CHF 20 galaxus vouchers</b>
          </p>
          <input type="text" id="prize-name" placeholder="your name" />
          <input
            type="email"
            id="prize-email"
            placeholder="email (so we can reach you if you win)"
          />
          <button class="btn" id="prize-btn" type="button">enter draw</button>
          <p class="prize-note" id="prize-note"></p>
        </div>
        <p class="prize-after" id="prize-after" style="display: none">
          you're in the draw ✦
        </p>
        <p>
          you can close this tab.<br /><a href="index.html"
            >← back to main page</a
          >
        </p>
      </div>
    </div>

    <script>
      const ENDPOINT =
        "https://script.google.com/macros/s/AKfycbxlEp6h499NZIkLVpG6G8J_vsrNv32Kd_CMbimJE1m1YmDNmQBySdY036XNbVwzZ7nj/exec";
      const MEDIA = "video";

      const SAVE_KEY = "study1_session";
      const STEP_KEY = "study1_step";
      const CONSENT_KEY = "study1_consent";
      const INTRO_KEY = "study1_intro";
      const EXIT_KEY = "study1_exit";

      const CONSENT_INFO = {
        title: "SFXCHAR",
        researcher: "Madeleine Sandri",
        supervisor: "Henry Raymond, Henning Metzmacher",
        institution: "ETH Zürich, GTC",
        contact: "madeleine.sandri@gmail.com",
      };
      const CONSENT_HTML = `
        <div class="consent">
          <div class="slab">before we start</div>
          <div class="consent-head">information &amp; consent</div>
          <p>study: ${CONSENT_INFO.title} · researcher: ${CONSENT_INFO.researcher} (${CONSENT_INFO.supervisor}), ${CONSENT_INFO.institution}.</p>
          <p>you're taking part in a research study on tools that generate sound for video-game characters.</p>
          <ul>
            <li>participation is voluntary. you can stop anytime without giving a reason.</li>
            <li>your responses are stored anonymously and reported only in aggregated form, for this thesis and any resulting publication.</li>
            <li>we collect your ratings, comments, and basic background. no audio or video of you is recorded.</li>
            <li>the optional prize draw collects your name/email only to contact a winner. This data kept separate from your responses and deleted after the draw.</li>
            <li>questions: <a href="mailto:${CONSENT_INFO.contact}">${CONSENT_INFO.contact}</a> (study)</li>
          </ul>
          <label class="agree" id="agree-row">
            <input type="checkbox" id="agree-box">
            <span>i have read the information above and agree to participate. i am 18 or older.</span>
          </label>
          <p class="consent-note">you may request a copy of this information for your records.</p>
        </div>`;
      const INTRO_HTML = `
        <div class="consent">
          <div class="consent-head">how this works</div>
          <p>you'll read <b>10 character descriptions</b>. for each one you'll see <b>3 short videos (about 10 seconds each)</b> simulating that character's sound effects on a placeholder mesh.</p>
          <p>for each character, compare the 3 videos on four things:</p>
          <ul>
            <li><b>coherence</b>: which one's sounds fit together best among themselves (regardless of the description).</li>
            <li><b>match</b>: which best matches the character description.</li>
            <li><b>quality</b>: which has the best sound quality.</li>
            <li><b>preference</b>: rank the three from your favourite to your least favourite.</li>
          </ul>
          <p>the videos are shuffled and unlabelled every time, so judge them blind. this takes about 10–15 minutes.</p>
        </div>`;

      const PROMPTS = [
        {
          id: "p01",
          desc: "a very big scary ogre made out of stone",
          videos: {
            gen: "videos/p01_gen.mp4",
            clap: "videos/p01_clap.mp4",
            clap_st: "videos/p01_clap_st.mp4",
          },
        },
        {
          id: "p02",
          desc: "a drunk little fairy",
          videos: {
            gen: "videos/p02_gen.mp4",
            clap: "videos/p02_clap.mp4",
            clap_st: "videos/p02_clap_st.mp4",
          },
        },
        {
          id: "p03",
          desc: "a princess in her stone castle",
          videos: {
            gen: "videos/p03_gen.mp4",
            clap: "videos/p03_clap.mp4",
            clap_st: "videos/p03_clap_st.mp4",
          },
        },
        {
          id: "p04",
          desc: "a metal robot walking through a peaceful forest",
          videos: {
            gen: "videos/p04_gen.mp4",
            clap: "videos/p04_clap.mp4",
            clap_st: "videos/p04_clap_st.mp4",
          },
        },
        {
          id: "p05",
          desc: "An old tree that is a bit grumpy and annoyed by birds building nests on his branches",
          videos: {
            gen: "videos/p05_gen.mp4",
            clap: "videos/p05_clap.mp4",
            clap_st: "videos/p05_clap_st.mp4",
          },
        },
        {
          id: "p06",
          desc: "animated skeletons that slightly dance while walking",
          videos: {
            gen: "videos/p06_gen.mp4",
            clap: "videos/p06_clap.mp4",
            clap_st: "videos/p06_clap_st.mp4",
          },
        },
        {
          id: "p07",
          desc: "A quirky octopus",
          videos: {
            gen: "videos/p07_gen.mp4",
            clap: "videos/p07_clap.mp4",
            clap_st: "videos/p07_clap_st.mp4",
          },
        },
        {
          id: "p08",
          desc: "A wise druid walking through snow in an old medieval village",
          videos: {
            gen: "videos/p08_gen.mp4",
            clap: "videos/p08_clap.mp4",
            clap_st: "videos/p08_clap_st.mp4",
          },
        },
        {
          id: "p09",
          desc: "Squishy worm that is happy and makes squish noises as footsteps",
          videos: {
            gen: "videos/p09_gen.mp4",
            clap: "videos/p09_clap.mp4",
            clap_st: "videos/p09_clap_st.mp4",
          },
        },
        {
          id: "p10",
          desc: "8-bit robot that walks around the house and completes chores",
          videos: {
            gen: "videos/p10_gen.mp4",
            clap: "videos/p10_clap.mp4",
            clap_st: "videos/p10_clap_st.mp4",
          },
        },
      ];

      const QUESTIONS = [
        {
          key: "coherent",
          stmt: "in which video do the sounds fit together most consistently (independently of the description)?",
        },
        {
          key: "matches",
          stmt: "which best matches the character description?",
        },
        {
          key: "quality",
          stmt: "which has best sound quality?",
        },
        {
          key: "favourite",
          stmt: "rank the sounds: 1 = your favourite, 3 = least",
          type: "rank",
        },
      ];
      const CONDITIONS = ["gen", "clap", "clap_st"];
      const SLOTS = ["a", "b", "c"];
      const RANKS = ["1", "2", "3"];

      function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function freshSession() {
        return PROMPTS.map((p) => {
          const order = shuffle(CONDITIONS);
          const map = {};
          SLOTS.forEach((s, i) => (map[s] = order[i]));
          return { id: p.id, desc: p.desc, map, answers: {} };
        });
      }

      let session;
      try {
        const saved = sessionStorage.getItem(SAVE_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        session =
          parsed &&
          Array.isArray(parsed) &&
          parsed.length === PROMPTS.length &&
          parsed.every((s) => s && s.map && s.answers)
            ? parsed
            : freshSession();
      } catch (e) {
        session = freshSession();
      }

      let exitAnswers = {};
      try {
        const se = sessionStorage.getItem(EXIT_KEY);
        if (se) exitAnswers = JSON.parse(se) || {};
      } catch (e) {
        exitAnswers = {};
      }

      const EXIT_FIELDS = [
        "detect",
        "likelihood",
        "ai_integrity",
        "ai_constrained",
        "ai_adds",
        "ethics",
        "role",
        "age",
        "gender",
        "plays",
        "audio_bg",
      ];

      const el = (t, c, h) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        if (h != null) e.innerHTML = h;
        return e;
      };
      const stage = document.getElementById("stage");
      const counter = document.getElementById("counter"),
        pfill = document.getElementById("pfill");
      const prevBtn = document.getElementById("prev"),
        nextBtn = document.getElementById("next"),
        note = document.getElementById("note");
      const TOTAL = PROMPTS.length;

      let step = 0;
      try {
        const savedStep = parseInt(sessionStorage.getItem(STEP_KEY), 10);
        if (!isNaN(savedStep) && savedStep >= 0 && savedStep <= TOTAL)
          step = savedStep;
      } catch (e) {}

      let consented = false,
        consentAt = "";
      let awaitingConsent = false;
      try {
        const c = sessionStorage.getItem(CONSENT_KEY);
        if (c) {
          const o = JSON.parse(c);
          if (o && o.agreed) {
            consented = true;
            consentAt = o.at || "";
          }
        }
      } catch (e) {}

      let introSeen = false;
      try {
        if (sessionStorage.getItem(INTRO_KEY) === "1") introSeen = true;
      } catch (e) {}
      let awaitingIntro = false;

      function saveSession() {
        try {
          sessionStorage.setItem(SAVE_KEY, JSON.stringify(session));
          sessionStorage.setItem(STEP_KEY, String(step));
        } catch (e) {}
      }
      function saveExit() {
        try {
          sessionStorage.setItem(EXIT_KEY, JSON.stringify(exitAnswers));
        } catch (e) {}
      }
      function clearSaved() {
        try {
          sessionStorage.removeItem(SAVE_KEY);
          sessionStorage.removeItem(STEP_KEY);
          sessionStorage.removeItem(EXIT_KEY);
          sessionStorage.removeItem(CONSENT_KEY);
          sessionStorage.removeItem(INTRO_KEY);
        } catch (e) {}
      }

      function enforceRank(block, changed) {
        const slot = changed.name.split("_").pop();
        const rank = changed.value;
        block.querySelectorAll('input[type="radio"]:checked').forEach((inp) => {
          if (inp === changed) return;
          if (inp.value === rank && inp.name.split("_").pop() !== slot)
            inp.checked = false;
        });
        const assigned = {};
        block.querySelectorAll('input[type="radio"]:checked').forEach((inp) => {
          assigned[inp.name.split("_").pop()] = inp.value;
        });
        const assignedSlots = Object.keys(assigned);
        if (assignedSlots.length === SLOTS.length - 1) {
          const missingSlot = SLOTS.find((s) => !assignedSlots.includes(s));
          const used = Object.values(assigned);
          const missingRank = RANKS.find((r) => !used.includes(r));
          if (missingSlot && missingRank) {
            const tgt = block.querySelector(
              `input[name$="_${missingSlot}"][value="${missingRank}"]`,
            );
            if (tgt) tgt.checked = true;
          }
        }
        block.classList.remove("missing");
      }

      function softSavePrompt(i) {
        const p = PROMPTS[i],
          st = session[i];
        stage.querySelectorAll(".q[data-q]").forEach((block) => {
          const key = block.dataset.q;
          if (block.dataset.type === "rank") {
            const picks = {};
            RANKS.forEach((r) => {
              const sel = block.querySelector(
                `input[name="${p.id}_${key}_${r}"]:checked`,
              );
              if (sel) picks[r] = sel.value;
            });
            st.answers[key] = picks;
          } else {
            const sel = block.querySelector(
              `input[name="${p.id}_${key}"]:checked`,
            );
            if (sel) st.answers[key] = sel.value;
          }
        });
        saveSession();
      }

      function captureExit() {
        EXIT_FIELDS.forEach((n) => {
          const f = stage.querySelector(`[name="${n}"]`);
          if (!f) return;
          exitAnswers[n] =
            f.type === "radio"
              ? stage.querySelector(`[name="${n}"]:checked`)?.value || ""
              : f.value.trim();
        });
        saveExit();
      }

      function applyExit() {
        Object.entries(exitAnswers).forEach(([n, v]) => {
          if (v === "" || v == null) return;
          const f = stage.querySelector(`[name="${n}"]`);
          if (!f) return;
          if (f.type === "radio") {
            const r = stage.querySelector(`[name="${n}"][value="${v}"]`);
            if (r) r.checked = true;
          } else {
            f.value = v;
          }
        });
      }

      stage.addEventListener("change", (e) => {
        const input = e.target;
        if (awaitingConsent) {
          if (input && input.id === "agree-box") {
            const row = stage.querySelector(".agree");
            if (row && input.checked) row.classList.remove("missing");
          }
          return;
        }
        if (awaitingIntro) return;
        if (input.matches && input.matches('input[type="radio"]')) {
          const block = input.closest('.q[data-type="rank"]');
          if (block) enforceRank(block, input);
        }
        if (step < TOTAL) softSavePrompt(step);
        else captureExit();
      });
      stage.addEventListener("input", () => {
        if (awaitingConsent || awaitingIntro) return;
        if (step === TOTAL) captureExit();
      });

      function renderPrompt(i) {
        awaitingConsent = false;
        awaitingIntro = false;
        const p = PROMPTS[i],
          st = session[i];
        counter.textContent =
          "prompt " +
          String(i + 1).padStart(2, "0") +
          " / " +
          String(TOTAL).padStart(2, "0");
        pfill.style.width = (i / (TOTAL + 1)) * 100 + "%";
        const wrap = el("div");
        wrap.appendChild(el("div", "prompt-label", "character description"));
        wrap.appendChild(el("div", "prompt-desc", "<b>" + p.desc + "</b>"));
        const vids = el("div", "vids");
        SLOTS.forEach((slot) => {
          const cond = st.map[slot],
            src = p.videos[cond];
          const tag =
            MEDIA === "audio"
              ? `<audio controls preload="metadata" src="${src}"></audio>`
              : `<video controls preload="metadata" src="${src}"></video>`;
          vids.appendChild(
            el("div", "vid", `<div class="name">${slot}</div>${tag}`),
          );
        });
        wrap.appendChild(vids);
        QUESTIONS.forEach((q) => {
          const block = el("div", "q");
          block.dataset.q = q.key;
          if (q.type === "rank") {
            block.dataset.type = "rank";
            block.appendChild(el("p", "stmt", q.stmt));
            const saved = st.answers[q.key] || {};
            const RANK_LABELS = { 1: "1st", 2: "2nd", 3: "3rd" };
            let rows = "";
            RANKS.forEach((r) => {
              let opts = "";
              SLOTS.forEach((s) => {
                const sel = String(saved[r]) === s ? " checked" : "";
                opts += `<label><input type="radio" name="${p.id}_${q.key}_${r}" value="${s}"${sel}><span>${s}</span></label>`;
              });
              rows += `<div class="rankrow"><span class="ranklabel">${RANK_LABELS[r]}</span><div class="rankopts">${opts}</div></div>`;
            });
            block.appendChild(el("div", "rankrows", rows));
          } else {
            block.appendChild(el("p", "stmt", q.stmt));
            let ch = "";
            SLOTS.forEach((s) => {
              const sel = st.answers[q.key] === s ? " checked" : "";
              ch += `<label><input type="radio" name="${p.id}_${q.key}" value="${s}"${sel}><span>${s}</span></label>`;
            });
            block.appendChild(el("div", "choice", ch));
          }
          wrap.appendChild(block);
        });
        stage.replaceChildren(wrap);
        prevBtn.style.display = i > 0 ? "" : "none";
        nextBtn.textContent = "next →";
        note.textContent = "";
      }

      const EXIT_HTML = `

      </div>
        <div class="field" data-name="ethics" data-optional="1">
          <label>any extra comments?<span style="color:var(--faint)">(optional)</span></label>
          <textarea name="ethics" placeholder="open response…"></textarea>
        </div>

          <label>which best describes you? <span class="req">*</span></label>
          <select name="role"><option value="" disabled selected>select…</option><option>game developer / designer</option><option>sound designer</option><option>ML engineer</option><option>other</option></select>
        </div>
        <div class="field" data-name="age">
          <label>age <span class="req">*</span></label>
          <input type="number" name="age" min="12" max="99" placeholder="e.g. 27">
        </div>
        <div class="field" data-name="gender" data-optional="1">
          <label>gender</label>
          <div class="seg">
            <label><input type="radio" name="gender" value="female"><span>female</span></label>
            <label><input type="radio" name="gender" value="male"><span>male</span></label>
            <label><input type="radio" name="gender" value="non-binary"><span>non-binary</span></label>
            <label><input type="radio" name="gender" value="other"><span>other</span></label>
          </div>
        </div>
        <div class="q" data-name="plays" style="padding-top:6px">
          <p class="stmt">do you play video games regularly? <span class="req">*</span></p>
          <div class="scale"><span class="anchor">never</span>
          <div class="dots">
            ${[1, 2, 3, 4, 5].map((i) => `<label><input type="radio" name="plays" value="${i}"><span>${i}</span></label>`).join("")}
          </div><span class="anchor r">very often</span></div>
        </div>
        <div class="q" data-name="audio_bg">
          <p class="stmt">do you have any audio, music, or sound-design background? <span class="req">*</span></p>
          <div class="scale"><span class="anchor">none</span>
          <div class="dots">
            ${[1, 2, 3, 4, 5].map((i) => `<label><input type="radio" name="audio_bg" value="${i}"><span>${i}</span></label>`).join("")}
          </div><span class="anchor r">professional</span></div>
        </div>`;

      function renderConsent() {
        awaitingIntro = false;
        counter.textContent = "consent";
        pfill.style.width = "0%";
        stage.replaceChildren(el("div", null, CONSENT_HTML));
        prevBtn.style.display = "none";
        nextBtn.textContent = "continue →";
        note.textContent = "";
        awaitingConsent = true;
      }

      function renderIntro() {
        awaitingConsent = false;
        counter.textContent = "overview";
        pfill.style.width = "0%";
        stage.replaceChildren(el("div", null, INTRO_HTML));
        prevBtn.style.display = "none";
        nextBtn.textContent = "start →";
        note.textContent = "";
        awaitingIntro = true;
      }

      function renderExit() {
        awaitingConsent = false;
        awaitingIntro = false;
        counter.textContent = "final / " + String(TOTAL).padStart(2, "0");
        pfill.style.width = (TOTAL / (TOTAL + 1)) * 100 + "%";
        stage.replaceChildren(el("div", null, EXIT_HTML));
        applyExit();
        prevBtn.style.display = "";
        nextBtn.textContent = "submit responses";
        note.textContent = "";
      }

      function savePrompt(i) {
        const p = PROMPTS[i],
          st = session[i];
        let ok = true;
        stage.querySelectorAll(".q[data-q]").forEach((block) => {
          const key = block.dataset.q;
          if (block.dataset.type === "rank") {
            const picks = {};
            let filled = 0;
            RANKS.forEach((r) => {
              const sel = block.querySelector(
                `input[name="${p.id}_${key}_${r}"]:checked`,
              );
              if (sel) {
                picks[r] = sel.value;
                filled++;
              }
            });
            const distinct = new Set(Object.values(picks)).size === filled;
            if (filled === RANKS.length && distinct) {
              st.answers[key] = picks;
              block.classList.remove("missing");
            } else {
              ok = false;
              block.classList.add("missing");
            }
          } else {
            const sel = block.querySelector(
              `input[name="${p.id}_${key}"]:checked`,
            );
            if (sel) {
              st.answers[key] = sel.value;
              block.classList.remove("missing");
            } else {
              ok = false;
              block.classList.add("missing");
            }
          }
        });
        saveSession();
        return ok;
      }
      function validateExit() {
        captureExit();
        let ok = true,
          first = null;
        stage.querySelectorAll("[data-name]").forEach((node) => {
          if (node.dataset.optional) return;
          const name = node.dataset.name,
            f = node.querySelector(`[name="${name}"]`);
          const has =
            f &&
            (f.type === "radio"
              ? !!node.querySelector(`[name="${name}"]:checked`)
              : f.value.trim());
          node.classList.toggle("missing", !has);
          if (!has && !first) {
            first = node;
            ok = false;
          }
        });
        if (first)
          first.scrollIntoView({ behavior: "smooth", block: "center" });
        return ok;
      }
      function collectExit() {
        const ex = {};
        EXIT_FIELDS.forEach((n) => {
          const f = stage.querySelector(`[name="${n}"]`);
          if (!f) return;
          ex[n] =
            f.type === "radio"
              ? stage.querySelector(`[name="${n}"]:checked`)?.value || ""
              : f.value.trim();
        });
        return ex;
      }

      nextBtn.addEventListener("click", async () => {
        if (awaitingConsent) {
          const box = stage.querySelector("#agree-box");
          const row = stage.querySelector(".agree");
          if (!box || !box.checked) {
            if (row) row.classList.add("missing");
            note.textContent = "please check the box to continue";
            return;
          }
          consented = true;
          consentAt = new Date().toISOString();
          awaitingConsent = false;
          try {
            sessionStorage.setItem(
              CONSENT_KEY,
              JSON.stringify({ agreed: true, at: consentAt }),
            );
          } catch (e) {}
          if (!introSeen) renderIntro();
          else if (step >= TOTAL) renderExit();
          else renderPrompt(step);
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (awaitingIntro) {
          introSeen = true;
          awaitingIntro = false;
          try {
            sessionStorage.setItem(INTRO_KEY, "1");
          } catch (e) {}
          if (step >= TOTAL) renderExit();
          else renderPrompt(step);
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (step < TOTAL) {
          if (!savePrompt(step)) {
            note.textContent = "please answer every question";
            return;
          }
          step++;
          saveSession();
          if (step < TOTAL) renderPrompt(step);
          else renderExit();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          if (!validateExit()) {
            note.textContent = "please complete the required fields";
            return;
          }
          nextBtn.disabled = true;
          nextBtn.classList.add("loading");
          note.textContent = "sending… please don't close this tab";
          const sent = await submitAll();
          if (!sent) {
            nextBtn.disabled = false;
            nextBtn.classList.remove("loading");
          }
        }
      });
      prevBtn.addEventListener("click", () => {
        if (step === TOTAL) {
          step--;
          renderPrompt(step);
        } else if (step > 0) {
          step--;
          renderPrompt(step);
        }
        saveSession();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      async function submitAll() {
        const exit = collectExit();
        const payload = {
          study: "study1",
          submitted_at: new Date().toISOString(),
          prompts: session.map((s) => {
            const resolved = {};
            QUESTIONS.forEach((q) => {
              if (q.type === "rank") {
                const picks = s.answers[q.key] || {};
                resolved[q.key] = Object.entries(picks)
                  .map(([rank, slot]) => ({
                    rank: Number(rank),
                    slot,
                    condition: s.map[slot],
                  }))
                  .sort((a, b) => a.rank - b.rank);
              } else {
                const slot = s.answers[q.key];
                resolved[q.key] = { slot, condition: s.map[slot] };
              }
            });
            return {
              id: s.id,
              desc: s.desc,
              slot_map: s.map,
              answers: resolved,
            };
          }),
          detect: exit.detect,
          likelihood: exit.likelihood,
          ai_integrity: exit.ai_integrity,
          ai_constrained: exit.ai_constrained,
          ai_adds: exit.ai_adds,
          ethics: exit.ethics,
          role: exit.role,
          age: exit.age,
          gender: exit.gender,
          plays: exit.plays,
          audio_bg: exit.audio_bg,
          consent_agreed: consented ? "yes" : "",
          consent_at: consentAt,
        };
        try {
          if (ENDPOINT) {
            await fetch(ENDPOINT, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(payload),
            });
          } else {
            console.warn("No ENDPOINT set — payload:", payload);
          }
          clearSaved();
          document.getElementById("actions").style.display = "none";
          stage.style.display = "none";
          document.querySelector("header").style.display = "none";
          document.getElementById("done").style.display = "block";
          window.scrollTo({ top: 0, behavior: "smooth" });
          return true;
        } catch (err) {
          note.textContent = "could not send — check connection and retry";
          return false;
        }
      }

      if (!consented) {
        renderConsent();
      } else if (!introSeen) {
        renderIntro();
      } else if (step >= TOTAL) {
        renderExit();
      } else {
        renderPrompt(step);
      }

      (function () {
        const btn = document.getElementById("prize-btn");
        if (!btn) return;
        btn.addEventListener("click", async () => {
          const name = document.getElementById("prize-name").value.trim();
          const email = document.getElementById("prize-email").value.trim();
          const pnote = document.getElementById("prize-note");
          if (!name) {
            pnote.textContent = "please enter a name (or just close the tab)";
            return;
          }
          btn.disabled = true;
          btn.classList.add("loading");
          pnote.textContent = "";
          const prizePayload = {
            type: "prize_draw",
            study: "study1",
            name,
            email,
            submitted_at: new Date().toISOString(),
          };
          try {
            if (ENDPOINT) {
              await fetch(ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(prizePayload),
              });
            } else {
              console.warn("No ENDPOINT set — prize payload:", prizePayload);
            }
            document.getElementById("prize").style.display = "none";
            document.getElementById("prize-after").style.display = "block";
          } catch (err) {
            pnote.textContent = "could not enter — check connection and retry";
            btn.disabled = false;
            btn.classList.remove("loading");

        });
      })();

      (function () {
        const cv = document.getElementById("bg"),
          ctx = cv.getContext("2d");
        const reduce = window.matchMedia(
          "(prefers-reduced-motion:reduce)",
        ).matches;
        let w,
          h,
          dpr,
          nodes = [];
        const rnd = () => Math.random() * 2 - 1;
        const layout = [
          [0.5, 0.3],
          [0.18, 0.2],
          [0.82, 0.16],
          [0.3, 0.52],
          [0.7, 0.46],
          [0.5, 0.62],
          [0.1, 0.7],
          [0.9, 0.66],
          [0.38, 0.84],
          [0.66, 0.82],
          [0.22, 0.4],
          [0.86, 0.4],
          [0.5, 0.12],
          [0.14, 0.9],
          [0.88, 0.88],
        ];
        function size() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = cv.clientWidth = window.innerWidth;
          h = cv.clientHeight = window.innerHeight;
          cv.width = w * dpr;
          cv.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          nodes = layout.map((p, i) => ({
            x: p[0] * w,
            y: p[1] * h,
            vx: rnd() * 0.32,
            vy: rnd() * 0.32,
            ph: i * 1.3,
            r: i === 5 ? 4 : 2.6,
          }));
        }
        size();
        window.addEventListener("resize", size);
        function st() {
          const m = 24;
          for (const n of nodes) {
            n.vx += rnd() * 0.01;
            n.vy += rnd() * 0.01;
            n.vx = Math.max(-0.42, Math.min(0.42, n.vx));
            n.vy = Math.max(-0.42, Math.min(0.42, n.vy));
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < m) {
              n.x = m;
              n.vx *= -1;
            }
            if (n.x > w - m) {
              n.x = w - m;
              n.vx *= -1;
            }
            if (n.y < m) {
              n.y = m;
              n.vy *= -1;
            }
            if (n.y > h - m) {
              n.y = h - m;
              n.vy *= -1;
            }
          }
        }
        function frame(t, mv) {
          if (mv) st();
          ctx.clearRect(0, 0, w, h);
          const thr = Math.min(w, h) * 0.32;
          ctx.lineWidth = 1;
          for (let i = 0; i < nodes.length; i++)
            for (let j = i + 1; j < nodes.length; j++) {
              const d = Math.hypot(
                nodes[i].x - nodes[j].x,
                nodes[i].y - nodes[j].y,
              );
              if (d < thr) {
                ctx.strokeStyle =
                  "rgba(150,135,225," + (0.08 * (1 - d / thr)).toFixed(3) + ")";
                ctx.beginPath();
                ctx.moveTo(nodes[i].x, nodes[i].y);
                ctx.lineTo(nodes[j].x, nodes[j].y);
                ctx.stroke();
              }
            }
          for (const p of nodes) {
            const pulse = 0.5 + 0.4 * Math.sin(t * 1.1 + p.ph);
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
            g.addColorStop(
              0,
              "rgba(190,172,246," + (0.45 * pulse).toFixed(2) + ")",
            );
            g.addColorStop(0.4, "rgba(150,170,238,0.12)");
            g.addColorStop(1, "rgba(150,170,238,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 7, 0, 7);
            ctx.fill();
            ctx.fillStyle = "rgba(225,222,246,0.6)";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, 7);
            ctx.fill();
          }
        }
        if (reduce) {
          frame(0, false);
        } else {
          let t = 0;
          (function loop() {
            t += 0.01;
            frame(t, true);
            requestAnimationFrame(loop);
          })();
        }
      })();
    </script>
  </body>
</html>
